<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PALM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Zen+Kaku+Gothic+New:wght@500;900&display=swap">
<style>
/* Layout: one-screen manga page. Canvas stage centered, verdict buttons pinned under it. Single deliberate look (ink on pale lime paper). */
:root{
  --paper:#eef59a; --ink:#111014; --violet:#7b5bd6; --threat:#e0304a; --grace:#e2a92b; --dim:#55534a;
  --display:"Bangers","Impact",sans-serif; --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;overflow:hidden;touch-action:manipulation}
[hidden]{display:none!important}
#wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;position:relative}
#btn-pause{position:absolute;z-index:4;font-family:var(--display);font-size:22px;width:44px;height:44px;padding:0;background:var(--ink);color:var(--paper);border:2px solid var(--paper);flex:none}
#menu-links{position:absolute;display:flex;gap:10px;justify-content:center}
#menu-links button,#panel button{flex:0 0 auto;font-family:var(--display);font-size:20px;letter-spacing:.06em;padding:6px 16px;background:transparent;color:var(--paper);border:2px solid var(--paper)}
#panel{position:absolute;z-index:5;background:var(--ink);border:3px solid var(--paper);color:var(--paper);font-family:var(--body);display:flex;flex-direction:column;gap:14px;padding:20px;box-sizing:border-box;overflow:auto}
#panel h2{margin:0;font:400 44px var(--display);letter-spacing:.04em;color:var(--paper)}
#panel label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px}
#panel input[type=range]{flex:1;max-width:55%;accent-color:#7b5bd6}
#panel input[type=checkbox]{width:22px;height:22px;accent-color:#7b5bd6}
#panel .credit{font-size:18px;line-height:1.6}
#panel .credit b{display:block;font:400 26px var(--display);letter-spacing:.05em;color:var(--grace)}
#panel .close{align-self:flex-start;margin-top:auto}
#lb{position:absolute;display:flex;flex-direction:column;gap:10px;font-family:var(--body);color:var(--paper)}
#lbf{display:flex;gap:8px}
#lbname{flex:1;min-width:0;font:600 18px var(--body);padding:10px 12px;border:3px solid var(--paper);background:var(--ink);color:var(--paper);border-radius:0}
#lbname::placeholder{color:#9c9a85}
#lb button{flex:0 0 auto;font-family:var(--display);font-size:22px;padding:6px 18px;background:var(--violet);color:#fff;border:3px solid var(--paper)}
#lb button:disabled{opacity:.5}
#lbmsg{margin:0;font-size:14px;color:var(--grace);min-height:1.2em}
#lblist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
#lblist li{display:flex;gap:10px;font-size:17px;padding:3px 6px;border-bottom:1px solid rgba(238,245,154,.15)}
#lblist li.me{background:var(--violet)}
#lblist .rk{width:2ch;color:var(--grace);font-family:var(--display);font-size:20px}
#lblist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lblist .sc{font-family:var(--display);font-size:20px;letter-spacing:.04em}
canvas{max-width:100%;max-height:100%;aspect-ratio:3/4;background:var(--paper);border:3px solid var(--paper);display:block}
#ctl{display:flex;gap:12px;width:100%;max-width:600px;padding-top:10px}
button{flex:1;font-family:var(--display);font-size:clamp(22px,6vw,34px);letter-spacing:.06em;padding:12px 0;border:3px solid var(--paper);cursor:pointer;color:var(--ink)}
#pass{background:var(--paper)}
#blast{background:var(--violet);color:#fff}
button:focus-visible{outline:3px solid var(--grace);outline-offset:3px}
button small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.1em;opacity:.7}
</style>
<div id="wrap"><canvas id="c" width="600" height="800" aria-label="PALM game stage"></canvas>
<button id="btn-pause" type="button" hidden aria-label="Pause">II</button>
<div id="menu-links" hidden><button id="btn-settings" type="button">SETTINGS</button><button id="btn-credits" type="button">CREDITS</button></div>
<div id="panel" hidden role="dialog" aria-modal="true"></div>
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>
<div id="lb" hidden>
  <form id="lbf"><input id="lbname" maxlength="14" placeholder="Type your name" autocomplete="off" aria-label="Your name for the leaderboard"><button type="submit" id="lbgo">POST</button></form>
  <p id="lbmsg"></p>
  <ol id="lblist"></ol>
</div></div>
<div id="ctl">
  <button id="pass">LET PASS<small>← / ↓</small></button>
  <button id="blast">BLAST<small>→ / SPACE</small></button>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const C={paper:'#eef59a',ink:'#111014',violet:'#7b5bd6',threat:'#e0304a',grace:'#e2a92b',dim:'#55534a'};
const TOP=[[175,60],[580,40],[580,440],[205,480]], BOT=[[250,520],[580,478],[580,780],[285,780]];
const ROSTER={
  wanderer:{name:'WANDERER',tip:'Read the aura, then the eyes.',at:0},
  lurker:{name:'LURKER',tip:'A shadow that sometimes never comes. Do not flinch.',at:10},
  sleeper:{name:'SLEEPER',tip:'Eyes shut. Wait for them to open, then read them. Acting first is a strike.',at:16},
  herald:{name:'HERALD',tip:'Carries a sealed scroll. Always let a Herald pass, whatever its aura.',at:23},
  twins:{name:'TWINS',tip:'Two faces, one verdict. Blast if either one is a threat.',at:29},
  turncoat:{name:'TURNCOAT',tip:'Smiles at first. Wait: some turn. Strike too early and you strike an innocent.',at:35},
  child:{name:'THE CHILD',tip:'Scary aura, screaming crowd. Always let the Child pass. The crowd is wrong.',at:40},
};
let S={mode:'title',score:0,combo:1,strikes:0,beat:0,best:0,heat:0};
let fig=null,t0=0,win=2200,lurk=0,res=null,card=null,shake=0,rule=null,ruleLeft=0,seen=new Set(),force=null,boil=0,boilT=0,msg=null;
try{S.best=+localStorage.getItem('palm_best')||0}catch(e){}
const SET={music:.7,sfx:.8,shake:true,flashes:true,haptics:true};try{Object.assign(SET,JSON.parse(localStorage.getItem("palm_settings")||"{}"))}catch(e){}
function saveSet(){try{localStorage.setItem("palm_settings",JSON.stringify(SET))}catch(e){}}
let nextThump=0,shiftMod=null,lastShift=0,oneType=null,ac=null,paused=false,pauseAt=0,buffered=null,missT=-9999,missSeed=0;
function tone(f,d,type='square',v=.15,slide){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);gn.gain.setValueAtTime(Math.max(.0001,v*SET.sfx),ac.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(gn).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
// line boil: tiny per-layer jitter that changes ~8x a second, so hand-inked lines "breathe"
function j(k){const s=Math.sin(boil*12.9898+k*78.233)*43758.5453;return (s-Math.floor(s))-.5}
function layer(k,fn){g.save();g.translate(j(k)*1.6,j(k+1)*1.6);g.rotate(j(k+2)*.004);fn();g.restore()}
function poly(p,k=0){g.beginPath();p.forEach(([x,y],i)=>{const dx=j(k+i)*1.5,dy=j(k+i+9)*1.5;i?g.lineTo(x+dx,y+dy):g.moveTo(x+dx,y+dy)});g.closePath()}

function pickType(){const b=S.beat,unlocked=Object.entries(ROSTER).filter(([k,v])=>b>=v.at).map(([k])=>k);
  // rotation, not stacking: wanderer + the 2 newest specials; the newest one shows up most
  const sp=unlocked.slice(1).slice(-2);let pool=['wanderer',...sp,...(sp.length?[sp[sp.length-1]]:[])];
  if(shiftMod==='ALL')pool=['wanderer',...unlocked.slice(1)];if(shiftMod==='ONE')pool=[oneType];
  const fresh=unlocked.find(k=>!seen.has(k));if(fresh)return fresh;return pool[Math.floor(Math.random()*pool.length)]}
const R=(a,b)=>a+Math.random()*(b-a),RI=n=>Math.floor(Math.random()*n);
const SKIN=['#ffffff','#f6ead8','#ead2b4','#d3ad87','#a87a56','#7d5539'];
let lastClassic=false;
function newLook(){const useClassic=!lastClassic&&Math.random()<.17;lastClassic=useClassic;if(useClassic)return{classic:true,head:0,w:56,h:66,hair:0,hat:0,nose:0,ears:false,scar:false,freck:false,brow:5,mouth:18,skin:'#ffffff',seed:Math.random()*1000,tilt:0,mg:['tongue','none','none','none'][RI(4)],bg:'none',cg:'none',smug:false,bob:R(2,5),bobs:R(160,240)};return{head:RI(4),w:R(48,62),h:R(56,74),hair:RI(6),hat:Math.random()<.35?1+RI(4):0,nose:RI(3),ears:Math.random()<.6,scar:false,freck:Math.random()<.2,brow:R(3,7),mouth:R(12,22),skin:SKIN[RI(SKIN.length)],seed:Math.random()*1000,tilt:R(-.12,.12),mg:'none',bg:['raised','none','none'][RI(3)],cg:['blush','blush','sweat','none','none'][RI(5)],smug:Math.random()<.5,bob:R(2,7),bobs:R(140,260)}}
function newFig(){
  const b=S.beat,type=force||pickType();force=null;
  let threat=Math.random()<.5;
  const disguise=b>=10&&Math.random()<Math.min(.5,(b-8)*.04);
  const f={type,threat,look:newLook(),empty:false,turnAt:0,turned:false,openAt:0};
  if(type==='herald'){f.threat=false;f.aura=Math.random()<.6?C.threat:C.grace;f.slit=Math.random()<.5;f.smile=false}
  else if(type==='turncoat'){f.threat=Math.random()<.6;f.aura=C.grace;f.slit=false;f.smile=true;f.turnAt=.3+Math.random()*.3}
  else if(type==='lurker'){f.empty=Math.random()<.35;f.aura=threat?C.threat:C.grace;f.slit=threat;f.smile=!threat;if(f.empty)f.threat=false}
  else if(type==='sleeper'){f.aura=C.violet;f.slit=threat;f.smile=!threat;f.openAt=.2+Math.random()*.35}
  else if(type==='mirror'){f.aura=Math.random()<.5?C.threat:C.grace;f.slit=!threat;f.smile=Math.random()<.5}
  else if(type==='twins'){const a=Math.random()<.5,b2=Math.random()<.5;f.threat=a||b2;f.aura=C.violet;
    f.pair=[{slit:a,smile:Math.random()<.5,look:newLook()},{slit:b2,smile:Math.random()<.5,look:newLook()}]}
  else if(type==='child'){f.threat=false;f.aura=C.threat;f.slit=false;f.smile=Math.random()<.5;f.look.w=46;f.look.h=50;f.look.hat=0}
  else{const at=disguise?!threat:threat;f.aura=at?C.threat:C.grace;f.slit=threat;f.smile=disguise?!threat:!threat}
  return f;
}
function correctAct(f,k){
  if(rule==='ALL')return'blast'; if(rule==='NONE')return'pass';
  if(f.type==='turncoat'&&f.threat&&k<f.turnAt)return'early';
  if(f.type==='sleeper'&&k<f.openAt)return'early';
  return f.threat?'blast':'pass';
}
function maybeIntro(){
  // first time a character type appears, show its card
  const type=pickType();
  if(!seen.has(type)){seen.add(type);force=type;card={kind:'intro',type,t:performance.now()};S.mode='card';tone(523,.12,'triangle',.1);setTimeout(()=>tone(784,.2,'triangle',.1),120);return true}
  return false;
}
const MODS={ALL:['ALL HANDS','Every arrival you have met, all at once.'],FAST:['DOUBLE TIME','Everything comes 25% faster.'],NIGHT:['NIGHT SHIFT','The crowd is asleep. You are on your own.'],ONE:['ONE FACE','The same kind of arrival, over and over.']};
function newShift(){
  S.shift=Math.floor(S.beat/10)+1;shiftMod=null;
  if(S.beat>=40){const keys=Object.keys(MODS);shiftMod=keys[RI(keys.length)];if(shiftMod==='ONE'){const u=Object.entries(ROSTER).filter(([k,v])=>S.beat>=v.at&&k!=='wanderer').map(([k])=>k);oneType=u[RI(u.length)]}}
  card={kind:'shift',t:performance.now()};S.mode='card';tone(392,.15,'triangle',.12);setTimeout(()=>tone(523,.15,'triangle',.12),150);setTimeout(()=>tone(659,.25,'triangle',.12),300);
}
function startBeat(){
  if(ruleLeft>0){ruleLeft--}else{rule=null;if(S.beat>10&&S.beat%10===6&&shiftMod!=='ONE'){rule=Math.random()<.5?'ALL':'NONE';ruleLeft=3;card={kind:'rule',txt:rule==='ALL'?'LET NOTHING PASS':'MERCY: PASS EVERYONE',t:performance.now()};S.mode='card';tone(220,.3,'sawtooth',.1);return}}
  if(!rule&&maybeIntro())return;
  spawn();
}
function spawn(){
  fig=newFig();
  win=Math.max(900,2200-S.beat*55);if(S.beat>40)win=Math.max(600,900-(S.beat-40)*8);if(shiftMod==='FAST')win*=.75;
  if(fig.type==='sleeper'){const ms=150+Math.pow(Math.random(),1.6)*2200;win+=ms;fig.openAt=ms/win} // wildly variable nap: blink-short to agonizing
  // lurk: variable silence before the reveal. Wider spread as the run goes on.
  const spread=Math.min(1700,500+S.beat*60);lurk=250+Math.random()*spread;
  if(fig.type==='lurker'&&Math.random()<.5)lurk+=500;
  if(fig.type!=='lurker')lurk=0; // v1: arrivals pop in instantly; only the Lurker makes you wait
  nextThump=performance.now()+120;
  t0=performance.now();S.mode='lurk';
}
let fallT=0;function buzz(p){if(!SET.haptics)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let OL=[{},{},{}].map(()=>({gone:0,kind:''}));
function kiBoom(){buzz(45);shake=Math.max(shake,18);tone(85,.55,'sine',.45,30);tone(160,.3,'sawtooth',.18,50);try{const n=ac.sampleRate*.45,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);const src=ac.createBufferSource(),gn=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;gn.gain.value=.35*SET.sfx;src.buffer=b;src.connect(f).connect(gn).connect(ac.destination);src.start()}catch(e){}}
function strike(text,kind='flee'){const alive=OL.filter(o=>!o.gone);if(alive.length){const o=alive[RI(alive.length)];o.gone=performance.now();o.kind=kind}S.strikes++;S.combo=1;shake=16;buzz([50,40,50]);msg={text,t:performance.now()};missT=performance.now();missSeed=Math.random()*100;tone(70,.4,'square',.18,45)}
function act(a){
  const now=performance.now();if(!panelEl.hidden)return;
  if(S.mode==='title'||S.mode==='over'){hideBoard();menuLinks.hidden=true;startMusic();OL.forEach(o=>{o.gone=0;o.kind=''});S={...S,mode:'x',score:0,combo:1,strikes:0,beat:0,heat:0,shift:1};shiftMod=null;lastShift=0;rule=null;ruleLeft=0;seen=new Set();startBeat();return}
  if(paused){resume();return}
  if(S.mode==='card'&&card.kind==='intro'&&now-card.t>500){spawn();return}
  if(S.mode==='lurk'&&t0+lurk-now<=80){buffered=a;return}
  if(S.mode==='lurk'){strike('FLINCHED');tone(140,.2,'square',.12);res={a:'flinch',ok:false,t:now,dur:500};S.mode='resolve';S.beat++;return}
  if(S.mode!=='beat')return;
  const rt=now-t0-lurk,k=rt/win,want=correctAct(fig,k);
  const ok=a===want;
  if(fig.empty){ // empty lurk: only a blast is wrong
    if(a==='blast')strike('BLASTED THIN AIR');else{S.score+=50*S.combo;S.combo=Math.min(8,S.combo+1)}
  }else if(ok){S.score+=Math.round(100*S.combo+(rt<400?50:0)+(fig.type==='turncoat'&&fig.threat||fig.type==='sleeper'||fig.type==='child'?75:0));S.combo=Math.min(8,S.combo+1)}
  else strike(want==='early'?(fig.type==='sleeper'?'WOKE IT EARLY':a==='blast'?'STRUCK AN INNOCENT':'TOO EARLY'):fig.type==='child'&&a==='blast'?'YOU BLASTED A CHILD':a==='blast'?'STRUCK A FRIEND':'IT GOT THROUGH',a==='pass'?'ko':'flee');
  if(a==='blast'){S.heat=Math.min(1,S.heat+.25);}else{S.heat=Math.max(0,S.heat-.2);tone(300,.25,'sine',.14,200)}
  const good=fig.empty?a!=='blast':ok;res={a,ok:good,t:now+(good?85:0),dur:a==='blast'?450+S.heat*350:650};
  if(a==='blast'){res.fx=['fling','crumble','cover'][Math.floor(Math.random()*3)];res.shards=Array.from({length:26},()=>({x:(Math.random()-.5)*110,y:(Math.random()-.5)*130,v:.5+Math.random(),s:3+Math.random()*7,r:Math.random()*6,ink:Math.random()<.6}));setTimeout(kiBoom,Math.max(0,res.t-now))}S.mode='resolve';S.beat++;
}

function drawAura(cx,cy,col,t,alpha=1){
  g.save();poly(TOP);g.clip();g.globalAlpha=alpha;
  const gr=g.createRadialGradient(cx,cy,20,cx,cy,330);gr.addColorStop(0,'#fff');gr.addColorStop(.35,col+'cc');gr.addColorStop(1,col+'22');g.fillStyle=gr;g.fillRect(150,30,440,460);
  g.strokeStyle=C.ink;
  for(let i=0;i<64;i++){const a=i/64*Math.PI*2+j(i)*.03,r1=110+(i*37%40),r2=340;g.lineWidth=.6+((i*13)%5)*.5;g.beginPath();g.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);g.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);g.stroke()}
  g.restore();
}
function hands(open){
  g.fillStyle='#fff';g.lineWidth=3;
  const one=(x,flip)=>{g.save();g.translate(x,118);g.scale(flip,1);g.beginPath();g.moveTo(-18,30);g.lineTo(-20,-6);for(let i=0;i<4;i++){g.lineTo(-16+i*10,-26+Math.abs(i-1.5)*6);g.lineTo(-10+i*10,-4)}g.lineTo(20,26);g.closePath();g.fill();g.stroke();g.restore()};
  one(-62,1);
  if(open)one(62,-1);else{g.strokeStyle=C.threat;g.lineWidth=4;g.beginPath();g.moveTo(80,90);g.lineTo(96,70);g.stroke();g.strokeStyle=C.ink}
}
function face(L,o){ // parametric head: o={slit,smile,turned,closed,masked,big}
  if(L.classic){ // the two original v1 faces: grinning friend, frazzled grump
    const pan=o.react==='panic';g.save();g.lineWidth=3;g.strokeStyle=C.ink;g.lineJoin='round';
    g.fillStyle=C.ink;g.beginPath();for(let i=0;i<=14;i++){const a=Math.PI*1.05+i/14*Math.PI*.9,r=i%2?78:120+((L.seed*(i+3))%30);g.lineTo(Math.cos(a)*r,Math.sin(a)*r-20)}g.closePath();g.fill();
    g.fillStyle='#fff';g.beginPath();g.ellipse(0,0,56,66,0,0,7);g.fill();g.stroke();
    if(o.masked){g.restore();return}
    const up=pan?-14:0;g.lineWidth=5;g.beginPath();g.moveTo(-40,-22+up);g.lineTo(-12,(o.smile?-24:-12)+up);g.moveTo(40,-22+up);g.lineTo(12,(o.smile?-24:-12)+up);g.stroke();
    g.lineWidth=3;[-24,24].forEach(x=>{
      if(o.closed){g.beginPath();g.arc(x,-4,11,.15*Math.PI,.85*Math.PI);g.stroke();return}
      const W=pan?1.6:1;g.fillStyle='#fff';g.beginPath();g.ellipse(x,-2,13*W,9*W,0,0,7);g.fill();g.stroke();
      g.fillStyle=o.turned?C.threat:C.ink;g.beginPath();o.slit?g.ellipse(x,-2,2.2,9,0,0,7):g.arc(x,-2,6,0,7);g.fill()});
    if(o.closed){g.font='bold 22px sans-serif';g.fillStyle=C.ink;g.textAlign='left';g.fillText('z',40,-46+j(3)*4);g.fillText('Z',52,-66+j(4)*4)}
    g.beginPath();
    if(pan){g.fillStyle=C.ink;g.ellipse(0,32,20,18,0,0,7);g.fill()}
    else if(o.smile){g.arc(0,26,18,.15*Math.PI,.85*Math.PI);g.stroke()}else{g.moveTo(-18,34);g.lineTo(-6,24);g.lineTo(6,30);g.lineTo(18,22);g.stroke()}
    if(o.turned){g.strokeStyle=C.threat;g.lineWidth=3;for(let i=0;i<5;i++){g.beginPath();g.moveTo(-50+i*25,-70);g.lineTo(-44+i*25,-50);g.stroke()}}
    g.restore();return;
  }
  const w=L.w,h=L.h;g.save();g.rotate(L.tilt);g.lineWidth=3;g.strokeStyle=C.ink;g.lineJoin='round';g.lineCap='round';
  const sd=n=>{const v=Math.sin(L.seed+n*91.7)*999;return v-Math.floor(v)};
  // hair behind
  g.fillStyle=C.ink;
  if(L.hair===0){g.beginPath();for(let i=0;i<=14;i++){const a=Math.PI*1.05+i/14*Math.PI*.9,r=i%2?h*1.1:h*1.6+sd(i)*h*.5+j(i)*4;g.lineTo(Math.cos(a)*r*w/56,Math.sin(a)*r-18)}g.closePath();g.fill()}
  if(L.hair===4){[-1,1].forEach(s2=>{g.beginPath();g.arc(s2*w*.85,-h*.85,w*.38,0,7);g.fill()})}

function frame(t){

      const seenFor=t-t0-lurk;
      onl=shiftMod==='NIGHT'?'sleep':f.type==='child'?'fear':(f.type==='sleeper'&&k<f.openAt)?'tense':((f.threat&&!(f.type==='turncoat'&&k<f.turnAt))?'fear':'calm');

  }else{g.save();poly(TOP);g.clip();g.strokeStyle='#c9c6b8';g.lineWidth=1;for(let i=0;i<30;i++){g.beginPath();g.moveTo(180+i*15,40);g.lineTo(160+i*15,480);g.stroke()}g.restore()}
  // combo escalation: speed lines, heavier border

  if(cb>=4){g.save();g.strokeStyle=C.ink;g.lineWidth=cb>=8?2.5:1.5;const n=cb>=8?26:14;for(let i=0;i<n;i++){const y=20+i*(440/n)+j(i+40)*10;g.beginPath();g.moveTo(170-((i*37)%60),y);g.lineTo(150-((i*37)%60)-60,y+30);g.stroke()}g.restore()}
  poly(TOP,5);g.lineWidth=6+Math.min(7,cb-1);g.strokeStyle=C.ink;g.stroke();

  drawOnlookers(onl);
  {let push=0;if(S.mode==='resolve'&&res.a==='blast'){const bq=(t-res.t)/res.dur;push=bq<0?0:bq<.08?bq/.08*44:bq<.4?44-(bq-.08)/.32*32:12}

      res.shards.forEach(sh=>{const a=Math.max(0,1-cq*1.3);if(!a)return;g.globalAlpha=a;g.save();g.translate(420+sh.x+cq*sh.v*60,230+sh.y-cq*sh.v*170);g.rotate(sh.r+cq*sh.v*3);const z=sh.s*(1-cq*.6);g.fillStyle=sh.ink?C.ink:'#fff';g.strokeStyle=C.ink;g.lineWidth=1.5;g.beginPath();g.moveTo(-z,-z*.4);g.lineTo(z*.7,-z*.8);g.lineTo(z,z*.5);g.lineTo(-z*.2,z*.7);g.closePath();g.fill();if(!sh.ink)g.stroke();g.restore()});
      g.restore();g.globalAlpha=1}
    let a=q<.15?Math.max(0,q)/.15:q<.55?1:Math.max(0,1-(q-.55)/.45);if(!SET.flashes)a*=.55;
    if(!imp){g.fillStyle=`rgba(255,255,255,${a*.85})`;g.fillRect(-20,-20,640,840)}else{g.save();g.globalCompositeOperation='difference';g.fillStyle='#fff';g.fillRect(-20,-20,640,840);g.restore()}
    if(q>.2&&q<.7)txt('BLASTED',300,420,90,C.violet);
  }
  if(S.mode==='resolve'&&res.a==='pass'&&(t-res.t)<550)txt('PASSED',300,420,90,C.dim);
  if(S.mode==='resolve'&&res.a==='flinch'&&(t-res.t)<500)txt('FLINCHED',300,420,90,C.threat);
  if(S.mode==='card'){
